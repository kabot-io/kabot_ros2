controller_manager:
  ros__parameters:
    update_rate: 10
    kabot_state_broadcaster:
      type: state_interfaces_broadcaster/StateInterfacesBroadcaster
    kabot_wheel_pid:
      type: pid_controller/PidController
    kabot_base_controller:
      type: diff_drive_controller/DiffDriveController

kabot_state_broadcaster:
  ros__parameters:
    interfaces:
      - kabot/heartbeat
      - left_wheel_joint/position
      - left_wheel_joint/velocity
      - right_wheel_joint/position
      - right_wheel_joint/velocity

kabot_wheel_pid:
  ros__parameters:
    dof_names: [left_wheel_joint, right_wheel_joint]
    command_interface: effort
    reference_and_state_interfaces: [velocity]
    use_external_measured_states: false
    set_current_state_as_first_setpoint: false
    gains:
      left_wheel_joint:
        p: 0.0
        i: 0.0
        d: 0.0
        feedforward_gain: 1.0
        u_clamp_min: -1.0
        u_clamp_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        antiwindup_strategy: conditional_integration
        save_i_term: false
      right_wheel_joint:
        p: 0.0
        i: 0.0
        d: 0.0
        feedforward_gain: 1.0
        u_clamp_min: -1.0
        u_clamp_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        antiwindup_strategy: conditional_integration
        save_i_term: false

kabot_base_controller:
  ros__parameters:
    left_wheel_names: [kabot_wheel_pid/left_wheel_joint]
    right_wheel_names: [kabot_wheel_pid/right_wheel_joint]
    wheel_separation: 0.102
    wheel_radius: 0.016
    publish_rate: 10.0
    odom_frame_id: odom
    base_frame_id: base_link
    tf_frame_prefix: ""
    open_loop: true
    position_feedback: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.3
    velocity_rolling_window_size: 1