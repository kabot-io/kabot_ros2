[workspace]
authors = ["Krzysztof Pochwała <krzysztof.pochwala@gmail.com>"]
channels = ["https://prefix.dev/robostack-lyrical", "https://prefix.dev/conda-forge"]
name = "ros_lyrical"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[target.linux-64.activation]
scripts = ["scripts/activate.sh"]

[target.win-64.activation]
scripts = ["scripts/activate.bat"]

[tasks]
sim = { cmd = ["bash", "scripts/sim.sh"], depends-on = ["build"] }
build = { cmd = ["colcon", "build", "--packages-up-to", "kabot_robot", "--symlink-install"] }
test = { cmd = "colcon test --packages-select kabot_robot && colcon test-result --test-result-base build/kabot_robot", depends-on = ["build"] }
view = { cmd = ["ros2", "launch", "kabot_robot", "view_robot.launch.py"], depends-on = ["build"] }
mock = { cmd = ["bash", "scripts/mock.sh"], depends-on = ["build"] }
clean = { cmd = ["rm", "-rf", "install", "build", "log"] }

[target.win-64.tasks]
# Copy installed files: Windows symlinks require Developer Mode or elevation.
build = { cmd = ["colcon", "build", "--packages-up-to", "kabot_robot", "--cmake-args", "-G", "Ninja", "-DAMENT_CMAKE_SYMLINK_INSTALL=OFF"] }
sim = { cmd = ["cmd", "/d", "/c", "scripts\\ros2.bat", "launch", "kabot_robot", "gazebo.launch.py"], depends-on = ["build"] }
mock = { cmd = ["cmd", "/d", "/c", "scripts\\ros2.bat", "launch", "kabot_robot", "mock.launch.py"], depends-on = ["build"] }
view = { cmd = ["cmd", "/d", "/c", "scripts\\ros2.bat", "launch", "kabot_robot", "view_robot.launch.py"], depends-on = ["build"] }

[target.win-64.dependencies]
cmake = "*"
ninja = "*"

[dependencies]
ros-lyrical-desktop = ">=0.13.0,<0.14"
ros-lyrical-ros-gz = ">=3.0.10,<4"
ros-lyrical-gz-ros2-control = ">=3.0.9,<4"
ros-lyrical-ros2-controllers = ">=6.9.0,<7"
ros-lyrical-ros2-control = ">=6.10.0,<7"
ros2-gz-ros2-control-demos = ">=3.0.9,<4"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-lyrical-joint-state-publisher = ">=2.4.3,<3"
ros-lyrical-joint-state-publisher-gui = ">=2.4.3,<3"
